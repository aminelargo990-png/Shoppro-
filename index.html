body{margin:0;font-family:'Cairo',system-ui,sans-serif;background:var(--bg) var(--pt) center top/240px 240px;color:var(--tx);min-height:100vh}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:92px}
.i{display:inline-block;vertical-align:middle;flex:none}
.head{background:var(--ptw) center/240px 240px,var(--hd);color:#fff;padding:22px 20px 46px;border-radius:0 0 28px 28px;display:flex;align-items:center;justify-content:space-between;gap:10px}

.chip{background:rgba(255,255,255,.16);padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.body{padding:0 16px;margin-top:-28px;position:relative}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 8px 26px rgba(10,58,54,.09);margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:14px 0 6px}
input,select{width:100%;padding:14px 15px;border:1.5px solid var(--bd);border-radius:14px;font:inherit;font-size:16px;background:#f8fbfa;color:var(--tx);outline:none;transition:.15s}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--g),var(--g2));margin-top:16px;cursor:pointer;box-shadow:0 8px 18px rgba(22,163,74,.28)}
.btn:active{transform:scale(.98)}
.btn.sec{background:#e8f3f1;color:var(--p);box-shadow:none}
.btn.danger{background:#fee2e2;color:var(--err);box-shadow:none}
.btn[disabled]{opacity:.6}
.inline{display:flex;gap:8px}.inline input{flex:1}
.icon-btn{border:0;background:var(--dk);color:#fff;border-radius:14px;width:54px;cursor:pointer;display:flex;align-items:center;justify-content:center}

.nav button.on{color:var(--g);background:#e9f8ee}
.hide{display:none!important}
.off{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;pointer-events:none}
.preview{width:100%;aspect-ratio:4/3;border-radius:16px;background:#eef4f3;display:flex;align-items:center;justify-content:center;color:#a7bab7;margin-bottom:8px;overflow:hidden;border:1.5px dashed var(--bd)}

.two{display:flex;gap:8px}.two label.btn{margin-top:4px;font-size:14px;padding:12px;cursor:pointer;flex:1;color:var(--p)}

.big{font-size:18px;padding:18px}

.modal{position:fixed;inset:0;background:rgba(5,30,28,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:90}

@keyframes s{to{transform:rotate(360deg)}}
.langtop{position:absolute;top:14px;inset-inline-end:14px;display:flex;gap:6px}
.langtop button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}

const url = (k,u) => { u=(u||'').trim(); if(!u)return ''; if(/^https?:\/\//i.test(u))return u;

/* ---------- images ---------- */
function compress(file,max=1280){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej()},'image/jpeg',.85)};img.onerror=rej;img.src=u;});}
async function upload(bucket,blob){const path=`${me.id}/${Date.now()}.jpg`;const {error}=await sb.storage.from(bucket).upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;}
function imgPicker(label,current){return `<label>${label}</label><div class="preview" id="prev">${current?`<img src="${esc(current)}">`:ic('image',44)}</div>
<div class="two"><label class="btn sec" for="fCam">${ic('camera',20)} ${t('camera')}</label><label class="btn sec" for="fGal">${ic('image',20)} ${t('gallery')}</label></div>
<input type="file" id="fCam" accept="image/*" capture="environment" class="off"><input type="file" id="fGal" accept="image/*" class="off">`;}
function bindImg(setBlob){
  const on=async f=>{if(!f)return;try{const b=await compress(f);setBlob(b);$('#prev').innerHTML=`<img src="${URL.createObjectURL(b)}">`;}catch(x){toast(em(x));}};
  $('#fCam').onchange=e=>{on(e.target.files[0]);e.target.value='';};$('#fGal').onchange=e=>{on(e.target.files[0]);e.target.value='';};
}

/* ---------- barcode scanner ---------- */
let scanner=null, torchOn=false;
async function stopScan(){document.querySelectorAll('.zoom,.hint,.ring').forEach(x=>x.remove());if(scanner){try{await scanner.stop();scanner.clear();}catch{}scanner=null;}torchOn=false;}
async function startScan(elId,onCode){
  await stopScan();
  const F=Html5QrcodeSupportedFormats;
  scanner=new Html5Qrcode(elId,{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.ITF,F.QR_CODE],experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
  let done=false;
  const ok=txt=>{if(done)return;done=true;if(navigator.vibrate)navigator.vibrate(60);onCode(txt);};
  const box=(w,h)=>({width:Math.floor(w*.92),height:Math.floor(Math.min(h*.8,w*.6))});
  // 1) high resolution + continuous autofocus; 2) plain fallback if the phone refuses
  const tries=[
    {fps:20,qrbox:box,videoConstraints:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30},focusMode:'continuous'}},
    {fps:15,qrbox:box,videoConstraints:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}},
    {fps:12,qrbox:box}
  ];
  let started=false;
  for(const cfg of tries){
    try{await scanner.start({facingMode:'environment'},cfg,ok,()=>{});started=true;break;}
    catch(e){console.warn('scan config failed',e);try{await scanner.stop();}catch{}}
  }
  if(!started){toast(t('camErr'));scanner=null;return;}
  tuneCam(elId);
}
async function tuneCam(elId){
  const host=document.getElementById(elId);
  const v=host&&host.querySelector('video');
  const tr=v&&v.srcObject&&v.srcObject.getVideoTracks&&v.srcObject.getVideoTracks()[0];
  if(!tr||!tr.getCapabilities)return;
  const caps=tr.getCapabilities();
  try{if(caps.focusMode&&caps.focusMode.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});}catch{}
  const sbox=host.parentElement;
  sbox.querySelectorAll('.hint').forEach(x=>x.remove());
  const hint=document.createElement('div');hint.className='hint';hint.textContent=t('focusHint');sbox.appendChild(hint);
  setTimeout(()=>hint.remove(),6000);
  // tap anywhere on the camera to re-focus
  host.onclick=async ev=>{
    const r=sbox.getBoundingClientRect();
    const ring=document.createElement('div');ring.className='ring';
    ring.style.left=(ev.clientX-r.left)+'px';ring.style.top=(ev.clientY-r.top)+'px';
    sbox.appendChild(ring);setTimeout(()=>ring.remove(),900);
    try{
      const fm=caps.focusMode||[];
      if(fm.includes('single-shot'))await tr.applyConstraints({advanced:[{focusMode:'single-shot'}]});
      else if(fm.includes('manual'))await tr.applyConstraints({advanced:[{focusMode:'manual'}]});
      setTimeout(()=>tr.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{}),1500);
    }catch{}
  };
  if(caps.zoom&&caps.zoom.max>caps.zoom.min){
    const box=host.parentElement;
    box.querySelectorAll('.zoom').forEach(x=>x.remove());
    const start=Math.min(caps.zoom.max,Math.max(caps.zoom.min,2));
    const z=document.createElement('div');z.className='zoom';
    z.innerHTML=`<span>1x</span><input type="range" min="${caps.zoom.min}" max="${caps.zoom.max}" step="${caps.zoom.step||0.1}" value="${start}"><span>${Math.round(caps.zoom.max)}x</span>`;
    box.appendChild(z);
    const r=z.querySelector('input');
    r.oninput=()=>tr.applyConstraints({advanced:[{zoom:Number(r.value)}]}).catch(()=>{});
    try{await tr.applyConstraints({advanced:[{zoom:start}]});}catch{}
  }
}
async function decodeFile(file){
  const fmts=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code'];
  if('BarcodeDetector' in window){
    try{const bmp=await createImageBitmap(file);const d=new BarcodeDetector({formats:fmts});const r=await d.detect(bmp);if(r.length)return r[0].rawValue;}catch(e){console.warn(e);}
  }
  const el=document.createElement('div');el.id='tmpdec';el.style.display='none';document.body.appendChild(el);
  try{
    const F=Html5QrcodeSupportedFormats;
    const q=new Html5Qrcode('tmpdec',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.ITF,F.QR_CODE],verbose:false});
    const r=await q.scanFile(file,false);try{q.clear();}catch{}return r;
  }catch(e){return null;}finally{el.remove();}
}
function bindBarcodePhoto(closeScan){
  const f=$('#fBc');if(!f)return;
  f.onchange=async e=>{
    const file=e.target.files[0];e.target.value='';if(!file)return;
    if(closeScan)await closeScan();
    toast(t('reading'));
    const code=await decodeFile(file);
    if(code){$('#pb').value=code;if(navigator.vibrate)navigator.vibrate(60);toast(t('saved'));}
    else toast(t('badRead'));
  };
}
async function toggleTorch(btn){
  const v=document.querySelector('#reader video');
  const tr=v&&v.srcObject&&v.srcObject.getVideoTracks&&v.srcObject.getVideoTracks()[0];
  if(!tr)return toast(t('noTorch'));
  try{
    const caps=tr.getCapabilities?tr.getCapabilities():{};
    if(!('torch' in caps))throw new Error('no torch');
    torchOn=!torchOn;
    await tr.applyConstraints({advanced:[{torch:torchOn}]});
    btn.classList.toggle('on',torchOn);
  }catch(e){torchOn=false;btn.classList.remove('on');toast(t('noTorch'));}
}

    const name=$('#pn').value.trim(),price=$('#pp').value,barcode=$('#pb').value.trim();
    if(!name||price===''||!barcode)return toast(t('required'));
    const btn=$('#sv');busy(btn,true);
    try{
      const row={name,price:Number(price),barcode};
      if(blob)row.image_url=await upload('product-images',blob);
      const {error}=await sb.from('products').update(row).eq('id',p.id);
      if(error)throw error;
      toast(t('saved'));go(pageProducts);
    }catch(e){busy(btn,false);toast(e.code==='23505'?t('dupBarcode'):em(e));}
  };
}

/* ---------- admin ---------- */
async function pageAdmin(tab='m'){
  view(`${head(ic('crown',24)+' '+t('admin'),`<button class="chip" id="lo" style="border:0;color:#fff;font:inherit;cursor:pointer">${t('logout')}</button>`)}
  <div class="body"><div class="lang" style="margin-bottom:14px"><button data-t="m" class="${tab==='m'?'on':''}">${t('merchants')}</button><button data-t="s" class="${tab==='s'?'on':''}">${t('adminSettings')}</button></div><div id="ab"></div></div>`);
  $('#lo').onclick=doLogout;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>go(()=>pageAdmin(b.dataset.t)));
  tab==='m'?adminMerchants():adminSettings();
}
async function adminMerchants(){
  $('#ab').innerHTML=`<div class="card"><input id="q" placeholder="${t('search')}"><div id="ml" style="margin-top:8px"></div></div>`;
  const {data,error}=await sb.from('stores').select('id,name,plan,created_at,profiles(phone)').order('created_at',{ascending:false}).limit(1000);
  if(error)return toast(t('err'));
  const draw=()=>{
    const q=$('#q').value.trim().toLowerCase();
    const l=data.filter(s=>!q||s.name.toLowerCase().includes(q)||(s.profiles?.phone||'').includes(q));
    $('#ml').innerHTML=l.length?l.map(s=>`<div class="row"><div class="nm"><span dir="ltr">${esc(s.profiles?.phone)}</span><small>${esc(s.name)}</small></div>
      <span class="pill ${s.plan==='unlimited'?'u':'t'}">${s.plan==='unlimited'?t('unlimited'):t('trial')}</span>
      ${s.plan==='trial'?`<button class="mini" data-id="${s.id}">${t('activate')}</button>`:''}</div>`).join(''):`<p class="center mut">${t('noMerch')}</p>`;
    document.querySelectorAll('#ml .mini').forEach(b=>b.onclick=async()=>{
      if(!confirm(t('confirmActivate')))return;
      const {error}=await sb.from('stores').update({plan:'unlimited'}).eq('id',b.dataset.id);
      if(error)return toast(t('err'));
      data.find(x=>x.id===b.dataset.id).plan='unlimited';toast(t('activated'));draw();
    });
  };
  $('#q').oninput=draw;draw();
}
async function adminSettings(){
  await loadSettings();
  $('#ab').innerHTML=`<div class="card">
  <label style="margin-top:0">${t('adminWa')}</label><input id="wa" dir="ltr" value="${esc(S.admin_whatsapp)}">
  <label>${t('adminPhone')}</label><input id="ap" dir="ltr" value="${esc(profile.phone)}">
  <label>${t('newPw')}</label><input id="np" type="password" autocomplete="new-password">
  <button class="btn" id="sv">${t('save')}</button></div>`;
  $('#sv').onclick=async()=>{
    const btn=$('#sv');busy(btn,true);
    try{
      const wa=$('#wa').value.trim(),ph=$('#ap').value.replace(/[\s-]/g,''),np=$('#np').value;
      if(wa!==S.admin_whatsapp){const {error}=await sb.from('app_settings').update({admin_whatsapp:wa}).eq('id',1);if(error)throw error;S.admin_whatsapp=wa;}
      if(np){if(np.length<6)throw new Error(t('badPw'));const {error}=await sb.auth.updateUser({password:np});if(error)throw error;}
      if(ph!==profile.phone){
        if(!/^\+?\d{8,15}$/.test(ph))throw new Error(t('badPhone'));
        const {error}=await sb.auth.updateUser({email:ph+'@shoppro.app'});if(error)throw error;
        const r=await sb.from('profiles').update({phone:ph}).eq('id',me.id);if(r.error)throw r.error;
        profile.phone=ph;
      }
      toast(t('saved'));
    }catch(e){toast(e.message||t('err'));}
    busy(btn,false);
  };
}

async function pageCustomer(slug){
  const {data:st}=await sb.from('stores').select('id,name,logo_url,facebook,instagram,tiktok').eq('slug',slug).maybeSingle();
  if(!st)return view(`<div class="hero"><div class="logo">${ic('search',50)}</div><h1>${t('storeNF')}</h1></div>`);
  document.title=st.name;
  const soc=[['fb',st.facebook],['ig',st.instagram],['tk',st.tiktok]].filter(x=>x[1]);
  const lt=`<div class="langtop"><button data-l="ar">العربية</button><button data-l="fr">FR</button></div>`;
  const welcome=()=>{
    view(`<div class="hero" style="position:relative">${lt}<div class="logo">${st.logo_url?`<img src="${esc(st.logo_url)}">`:ic('store',56)}</div>
    <h1>${esc(st.name)}</h1><p>${t('welcome')} ${esc(st.name)}</p></div>
    <div class="body"><div class="card" style="margin-top:-28px">
    ${soc.length?`<div class="soc">${soc.map(([k,u])=>`<a href="${esc(url(k,u))}">${ICON[k]}</a>`).join('')}</div>`:''}
    <button class="btn big" id="sc">${ic('scan',24)} ${t('scanProduct')}</button></div></div>`);
    document.querySelectorAll('.langtop button').forEach(b=>b.onclick=()=>{setLang(b.dataset.l);welcome();});
    $('#sc').onclick=scanPage;
  };
  const scanPage=async()=>{
    view(`${head(t('scanProduct'),`<button class="chip" id="hm" style="border:0;color:#fff;font:inherit;cursor:pointer">${ic('home',20)}</button>`)}
    <div class="body"><div class="card"><div class="scanbox" style="margin:0"><div id="reader" class="reader"></div><button class="torch" id="tc">${ic('bolt',20)}</button></div>
    <p class="center mut">${t('tapScan')}</p></div><div id="out"></div></div>`);
    $('#hm').onclick=async()=>{await stopScan();welcome();};
    $('#tc').onclick=e=>toggleTorch(e.currentTarget);
    await startScan('reader',async code=>{
      await stopScan();
      const {data:p}=await sb.from('products').select('name,price,image_url').eq('store_id',st.id).eq('barcode',code.trim()).maybeSingle();
      view(`${head(esc(st.name),`<button class="chip" id="hm" style="border:0;color:#fff;font:inherit;cursor:pointer">${ic('home',20)}</button>`)}
      <div class="body"><div class="card res center">${p?`${p.image_url?`<img src="${esc(p.image_url)}">`:'<div class="preview">'+ic('image',44)+'</div>'}<h2>${esc(p.name)}</h2><div class="pr">${money(p.price)}</div><div class="found">${ic('check',16)} ${t('found')}</div>`
        :`<div class="center mut">${ic('search',54)}</div><h2>${t('notFound')}</h2><p class="mut" dir="ltr">${esc(code)}</p>`}</div>
      <button class="btn big" id="nw">${ic('scan',24)} ${t('scanNew')}</button></div>`);
      $('#hm').onclick=welcome;$('#nw').onclick=scanPage;
    });
  };
  welcome();
}

/* ---------- boot ---------- */
async function boot(){
  const slug=new URLSearchParams(location.search).get('s');
  if(slug)return pageCustomer(slug);
  await loadSettings();
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return go(pageLogin);
  me=session.user;
  const {data:pr}=await sb.from('profiles').select('role,phone').eq('id',me.id).maybeSingle();
  if(!pr){const ph=(me.email||'').split('@')[0];const r=await sb.from('profiles').insert({id:me.id,phone:ph}).select('role,phone').single();if(r.error)toast(em(r.error));profile=r.data||{role:'merchant',phone:ph};}else profile=pr;
  if(profile.role==='admin')return location.replace('admin.html');
  const {data:st}=await sb.from('stores').select('*').eq('owner_id',me.id).maybeSingle();
  store=st;
  if(!store)return go(()=>pageStoreInfo(true));
  go(pageAdd);
}
boot();
</script>
