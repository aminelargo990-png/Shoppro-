setLang(lang);
let toastT;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),4500);}
const view=h=>{$('#app').innerHTML=h;window.scrollTo(0,0);};
const em=e=>{console.error(e);return String((e&&e.message)||t('err'));};
function busy(btn,on){btn.disabled=on;if(on){btn._h=btn.innerHTML;btn.innerHTML='<span class="spin"></span>';}else if(btn._h)btn.innerHTML=btn._h;}
let me=null,profile=null,S={admin_whatsapp:''},stores=[];
const head=(title,right='')=>`<div class="head"><h1>${title}</h1>${right}</div>`;
async function logout(){await sb.auth.signOut();me=profile=null;pageLogin();}

function pageLogin(){
  view(`<div class="hero" style="position:relative"><div class="langtop"><button data-l="ar">العربية</button><button data-l="fr">FR</button></div>
  <div class="logo">${ic('crown',54)}</div><h1>Shop<b>Pro</b></h1><p>${t('tag')}</p></div>
  <div class="body"><div class="card" style="margin-top:-30px">
  <label>${t('phone')}</label><div class="fld">${ic('phone',20)}<input id="ph" type="tel" inputmode="tel" autocomplete="username"></div>
  <label>${t('password')}</label><div class="fld">${ic('lock',20)}<input id="pw" type="password" autocomplete="current-password"></div>
  <button class="btn" id="go">${t('login')}</button></div></div>`);
  document.querySelectorAll('.langtop button').forEach(b=>b.onclick=()=>{setLang(b.dataset.l);pageLogin();});
  const run=async()=>{
    const phone=$('#ph').value.replace(/[\s-]/g,''),pw=$('#pw').value;
    if(!/^\+?\d{8,15}$/.test(phone))return toast(t('badPhone'));
    if(pw.length<6)return toast(t('badPw'));
    const btn=$('#go');busy(btn,true);
    const {error}=await sb.auth.signInWithPassword({email:phone+'@shoppro.app',password:pw});
    if(error){busy(btn,false);return toast(t('wrongCred'));}
    boot();
  };
  $('#go').onclick=run;$('#pw').onkeydown=e=>{if(e.key==='Enter')run();};
}

function pageNotAdmin(){
  const sql=`update public.profiles set role = 'admin' where phone = '${profile.phone}';`;
  view(`${head(ic('lock',22)+' '+t('notAdmin'),`<button class="chip" id="lo" style="border:0;color:#fff;font:inherit;cursor:pointer">${t('logout')}</button>`)}
  <div class="body"><div class="card">
  <div class="kv"><span>${t('yourPhone')}</span><span dir="ltr">${esc(profile.phone)}</span></div>
  <div class="kv"><span>${t('yourRole')}</span><span dir="ltr">${esc(profile.role)}</span></div>
  <p class="mut" style="font-weight:600;line-height:1.8">${t('notAdminHelp')}</p>
  <div class="sql" id="sql">${esc(sql)}</div>
  <button class="btn" id="cp">${ic('copy',20)} ${t('copy')}</button></div></div>`);
  $('#lo').onclick=logout;
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(sql);toast(t('copied'));}catch{const r=document.createRange();r.selectNodeContents($('#sql'));const s=getSelection();s.removeAllRanges();s.addRange(r);}};
}

async function loadSettings(){const {data}=await sb.from('app_settings').select('*').eq('id',1).maybeSingle();if(data)S=data;}

async function pageAdmin(tab='m'){
  view(`${head(ic('crown',24)+' '+t('title'),`<button class="chip" id="lo" style="border:0;color:#fff;font:inherit;cursor:pointer">${ic('logout',16)} ${t('logout')}</button>`)}
  <div class="body"><div class="lang" style="margin-bottom:14px"><button data-t="m" class="${tab==='m'?'on':''}">${t('merchants')}</button><button data-t="s" class="${tab==='s'?'on':''}">${t('settings')}</button></div><div id="ab"></div></div>`);
  $('#lo').onclick=logout;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>pageAdmin(b.dataset.t));
  tab==='m'?merchants():settings();
}

async function merchants(){
  $('#ab').innerHTML=`<div class="stats"><div class="stat"><b id="s1">–</b><span>${t('total')}</span></div><div class="stat"><b id="s2">–</b><span>${t('unlimited')}</span></div><div class="stat"><b id="s3">–</b><span>${t('trial')}</span></div></div>
  <div class="card"><div class="fld">${ic('search',20)}<input id="q" placeholder="${t('search')}"></div><div id="ml" style="margin-top:8px"></div></div>`;
  const {data,error}=await sb.from('stores').select('id,name,plan,created_at,profiles(phone),products(count)').order('created_at',{ascending:false}).limit(2000);
  if(error)return toast(em(error));
  stores=data||[];
  const cnt=s=>(s.products&&s.products[0]&&s.products[0].count)||0;
  const draw=()=>{
    $('#s1').textContent=stores.length;
    $('#s2').textContent=stores.filter(s=>s.plan==='unlimited').length;
    $('#s3').textContent=stores.filter(s=>s.plan!=='unlimited').length;
    const q=$('#q').value.trim().toLowerCase();
    const l=stores.filter(s=>!q||s.name.toLowerCase().includes(q)||(s.profiles?.phone||'').includes(q));
    $('#ml').innerHTML=l.length?l.map(s=>{const u=s.plan==='unlimited';return `<div class="row"><div class="nm"><span dir="ltr">${esc(s.profiles?.phone)}</span><small style="color:var(--mut)">${esc(s.name)} · ${cnt(s)} ${t('pcs')}</small></div>
      <span class="pill ${u?'u':'t'}">${u?t('unlimited'):t('trial')}</span>
      <button class="mini ${u?'off':''}" data-id="${s.id}" data-u="${u?1:0}">${u?t('deactivate'):t('activate')}</button></div>`;}).join(''):`<p class="center mut">${t('noMerch')}</p>`;
    document.querySelectorAll('#ml .mini').forEach(b=>b.onclick=async()=>{
      const u=b.dataset.u==='1';
      if(!confirm(u?t('confirmDeact'):t('confirmAct')))return;
      const plan=u?'trial':'unlimited';
      const {error}=await sb.from('stores').update({plan}).eq('id',b.dataset.id);
      if(error)return toast(em(error));
      stores.find(x=>x.id===b.dataset.id).plan=plan;toast(u?t('deactivated'):t('activated'));draw();
    });
  };
  $('#q').oninput=draw;draw();
}

async function settings(){
  await loadSettings();
  $('#ab').innerHTML=`<div class="card"><label style="margin-top:0">${t('language')}</label>
  <div class="lang"><button data-l="ar" class="${lang==='ar'?'on':''}">العربية</button><button data-l="fr" class="${lang==='fr'?'on':''}">Français</button></div></div>
  <div class="card"><label style="margin-top:0">${t('adminWa')}</label><input id="wa" dir="ltr" value="${esc(S.admin_whatsapp)}">
  <label>${t('adminPhone')}</label><input id="ap" dir="ltr" value="${esc(profile.phone)}">
  <label>${t('newPw')}</label><input id="np" type="password" autocomplete="new-password">
  <button class="btn" id="sv">${t('save')}</button></div>`;
  document.querySelectorAll('.lang [data-l]').forEach(b=>b.onclick=()=>{setLang(b.dataset.l);pageAdmin('s');});
  $('#sv').onclick=async()=>{
    const btn=$('#sv');busy(btn,true);
    try{
      const wa=$('#wa').value.trim(),ph=$('#ap').value.replace(/[\s-]/g,''),np=$('#np').value;
      if(wa!==S.admin_whatsapp){const {error}=await sb.from('app_settings').update({admin_whatsapp:wa}).eq('id',1);if(error)throw error;S.admin_whatsapp=wa;}
      if(np){if(np.length<6)throw new Error(t('badPw'));const {error}=await sb.auth.updateUser({password:np});if(error)throw error;}
      if(ph!==profile.phone){
        if(!/^\+?\d{8,15}$/.test(ph))throw new Error(t('badPhone'));
        const r=await sb.auth.updateUser({email:ph+'@shoppro.app'});if(r.error)throw r.error;
        if(r.data&&r.data.user&&r.data.user.new_email)throw new Error(t('phonePending'));
        const u=await sb.from('profiles').update({phone:ph}).eq('id',me.id);if(u.error)throw u.error;
        profile.phone=ph;
      }
      toast(t('saved'));
    }catch(e){toast(em(e));}
    busy(btn,false);
  };
}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return pageLogin();
  me=session.user;
  const {data:pr}=await sb.from('profiles').select('role,phone').eq('id',me.id).maybeSingle();
  profile=pr||{role:'—',phone:(me.email||'').split('@')[0]};
  if(profile.role!=='admin')return pageNotAdmin();
  pageAdmin('m');
}
boot();
</script>
</body>
</html>
